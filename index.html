<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yolanda W Fan — Art Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Karla:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#fcfdfb;--mist:#e8ebea;--leaf:#a9cc8e;--sage:#6f9f63;--ink:#2a382a;--soft:#5d6b5d;--card:#f1f5ee;--serif:'Instrument Serif',Georgia,serif;--sans:'Karla',system-ui,sans-serif;box-sizing:border-box}
*{box-sizing:inherit}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-weight:300;line-height:1.6}
a{color:inherit}
:focus-visible{outline:2px solid var(--sage);outline-offset:3px}
.hero{min-height:100svh;position:relative;display:flex;flex-direction:column;justify-content:space-between;padding:clamp(24px,5vw,56px);background:linear-gradient(180deg,#fcfdfb 0%,#e3e7e7 28%,#9fb89a 62%,#86b36f 100%);overflow:hidden}
.hero.small{min-height:48svh}
.hero::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.35;mix-blend-mode:multiply;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .6  0 0 0 0 .45  0 0 0 .9 0'/></filter><rect width='200' height='200' filter='url(%23n)'/></svg>")}
.hero>*{position:relative;z-index:1}
.top{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-size:.95rem}
.top a{text-decoration:none}
.top nav{display:flex;gap:20px}
.top nav a:hover,.top nav a[aria-current]{border-bottom:1px solid var(--ink)}
h1{font-family:var(--serif);font-weight:400;font-size:clamp(4.2rem,17vw,15rem);line-height:.88;margin:0;letter-spacing:-.03em}
h1 em{display:block;padding-left:.9em}
.small h1{font-size:clamp(3.4rem,12vw,10rem)}
.lede{max-width:36ch;margin:1.4rem 0 0;font-size:1.1rem}
.index{display:flex;gap:clamp(16px,4vw,48px);flex-wrap:wrap;margin-top:2rem}
.index a{font-family:var(--serif);font-size:clamp(1.5rem,3vw,2.2rem);text-decoration:none;border-bottom:1px solid transparent;transition:border-color .2s}
.index a:hover{border-color:var(--ink)}
section{padding:clamp(64px,10vw,140px) clamp(24px,5vw,56px)}
.head{display:flex;justify-content:space-between;align-items:baseline;gap:24px;flex-wrap:wrap;margin-bottom:2.5rem}
h2{font-family:var(--serif);font-weight:400;font-size:clamp(2.2rem,6vw,5rem);line-height:1;margin:0;letter-spacing:-.02em}
.head p{margin:0;max-width:36ch;color:var(--soft)}
.grid{display:grid;gap:clamp(14px,2vw,28px);grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr))}
figure{margin:0}
.tile{aspect-ratio:4/5;background:var(--card);overflow:hidden;display:block;width:100%}
.tile svg{width:100%;height:100%;display:block;transition:transform .8s cubic-bezier(.2,.7,.2,1)}
figure:hover .tile svg,a.cat:hover .tile svg{transform:scale(1.04)}
figcaption{display:flex;justify-content:space-between;padding-top:.6rem;font-size:.92rem;color:var(--soft)}
figcaption b{font-weight:400;color:var(--ink)}
a.cat{text-decoration:none;display:block}
a.cat h3{font-family:var(--serif);font-weight:400;font-size:clamp(2rem,4vw,3rem);margin:.7rem 0 0;line-height:1}
a.cat p{margin:.2rem 0 0;color:var(--soft)}
.more{display:flex;justify-content:space-between;flex-wrap:wrap;gap:16px;margin-top:4rem;font-family:var(--serif);font-size:clamp(1.5rem,3vw,2.2rem)}
.more a{text-decoration:none;border-bottom:1px solid var(--mist)}
.more a:hover{border-color:var(--ink)}
footer{padding:clamp(48px,8vw,100px) clamp(24px,5vw,56px) 48px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:24px;align-items:end;border-top:1px solid var(--mist)}
footer h3{font-family:var(--serif);font-weight:400;font-size:clamp(2rem,5vw,4rem);margin:0;line-height:1}
footer p{margin:0;color:var(--soft)}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}

</style></head>
<body><div id="app"></div>
<script>
// All artwork is placeholder SVG. Replace a piece's svg with: '<img src="images/file.jpg" alt="..." style="width:100%;height:100%;object-fit:cover">'
const S=(i,bg)=>`<svg viewBox="0 0 400 500" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg"><rect width="400" height="500" fill="${bg||'#f1f5ee'}"/>${i}</svg>`;
const L='#2a382a',G='#a9cc8e',D='#6f9f63',M='#e3e7e7',W='#fcfdfb';
const ln=(d,w=1.6,c=L)=>`<path d="${d}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round"/>`;
const n=k=>[...Array(k).keys()];
const brandCard=(t,mark,bg,fg)=>S(`<g transform="translate(200 210)">${mark}</g><text x="200" y="360" text-anchor="middle" font-family="Instrument Serif,Georgia,serif" font-size="40" fill="${fg}">${t}</text>`,bg);
const ART={
drawings:{title:'Drawings',blurb:'Ink and pencil studies of leaves, hands and the spaces between them.',items:[
['Fern study',S(ln('M200 460C200 300 210 180 240 60')+n(14).map(i=>{const y=420-i*26,l=70-i*3.5;return ln(`M${201+i*2.2} ${y}q${-l/2} -30 ${-l} -8`,1.2)+ln(`M${203+i*2.2} ${y-6}q${l/2} -30 ${l} -8`,1.2)}).join(''),'#f6f9f3'),'Ink on paper'],
['Open hand',S(ln('M110 420C120 330 100 260 130 210M150 410C160 300 150 200 175 130M195 410C205 300 205 190 225 110M240 415C250 310 260 220 285 160M280 430C310 380 330 340 345 290')+ln('M105 425C170 450 260 450 300 430',1.2,D),W),'Pencil, 2025'],
['Moon pond',S(`<circle cx="200" cy="190" r="90" fill="${G}" opacity=".7"/>`+n(6).map(i=>ln(`M${70+i*8} ${320+i*24}q${130-i*8} -26 ${260-i*16} 0`,1.2)).join(''),'#edf1ee'),'Charcoal and wash'],
['Pine branch',S(ln('M60 400C160 380 260 300 350 120')+n(16).map(i=>{const x=90+i*17,y=394-i*17;return ln(`M${x} ${y}l-14 34M${x} ${y}l16 -30`,1.1,D)}).join(''),'#f6f9f3'),'Ink on paper'],
['Stone wall',S(n(9).map(r=>n(4).map(c=>`<rect x="${40+c*80+(r%2)*40}" y="${60+r*46}" width="74" height="40" rx="8" fill="none" stroke="${L}" stroke-width="1.2"/>`+ln(`M${50+c*80+(r%2)*40} ${96+r*46}l16 -22M${62+c*80+(r%2)*40} ${96+r*46}l16 -22`,.7,D)).join('')).join(''),W),'Pencil hatching'],
['Reclining line',S(ln('M50 330C120 250 180 400 250 320S340 260 360 300',2)+ln('M70 360C140 290 190 430 260 350',1.1,D),'#edf1ee'),'One continuous line']]},
'graphic-design':{title:'Graphic design',blurb:'Posters, covers and editorial layouts built from shape and white space.',items:[
['Spring poster',S(`<circle cx="200" cy="210" r="120" fill="${G}"/><rect x="60" y="340" width="280" height="14" fill="${L}"/><rect x="60" y="370" width="170" height="14" fill="${L}"/><rect x="60" y="400" width="90" height="14" fill="${D}"/>`,W),'Print'],
['Fold',S(`<path d="M0 0H400V300L0 500Z" fill="${M}"/><path d="M0 500L400 300V500Z" fill="${D}"/><circle cx="110" cy="130" r="46" fill="${G}"/>`,W),'Book cover'],
['Grid no. 4',S(n(4).map(r=>n(3).map(c=>`<rect x="${50+c*100}" y="${70+r*100}" width="86" height="86" fill="${(r+c)%3==0?G:(r*c)%2?M:W}" stroke="${L}" stroke-width=".8"/>`).join('')).join(''),'#f4f7f2'),'Editorial layout'],
['Stripes',S(n(9).map(i=>`<rect x="0" y="${i*56}" width="400" height="${8+i*5}" fill="${i%2?G:D}" opacity=".85"/>`).join(''),W),'Poster'],
['Orbit',S(`<circle cx="200" cy="250" r="140" fill="none" stroke="${L}" stroke-width="1"/><circle cx="200" cy="250" r="90" fill="${M}"/><circle cx="318" cy="170" r="28" fill="${D}"/>`,W),'Album cover'],
['Type block',S(`<text x="40" y="200" font-family="Instrument Serif,Georgia,serif" font-size="150" fill="${L}">Aa</text><rect x="40" y="260" width="320" height="120" fill="${G}"/><rect x="40" y="400" width="200" height="8" fill="${L}"/>`,'#f4f7f2'),'Type specimen']]},
branding:{title:'Branding',blurb:'Identities for small studios, cafés and makers.',items:[
['Fernhill Café',brandCard('Fernhill',`<path d="M0 60C0 0 10-40 30-60M0 40q-30-10-40-34M0 10q-26-8-32-30M2 30q26-10 36-30" stroke="${L}" stroke-width="3" fill="none" stroke-linecap="round"/>`,'#f6f9f3',L),'Identity, menus'],
['Tidewater Studio',brandCard('Tidewater',`<circle r="52" fill="${W}"/><path d="M-52 0q26-22 52 0t52 0" stroke="${D}" stroke-width="5" fill="none"/>`,D,W),'Logo, packaging'],
['Olive & Thread',brandCard('Olive &amp; Thread',`<ellipse rx="26" ry="46" fill="${L}" transform="rotate(30)"/><path d="M-60 60C-20 20 20 20 60 60" stroke="${L}" stroke-width="2" fill="none"/>`,G,L),'Visual identity'],
['Moss Press',brandCard('Moss Press',`<rect x="-44" y="-44" width="88" height="88" fill="none" stroke="${L}" stroke-width="3"/><circle r="22" fill="${D}"/>`,W,L),'Logo, stationery'],
['Lantern Books',brandCard('Lantern',`<path d="M-26 40V-20a26 26 0 0 1 52 0V40Z" fill="${W}"/><rect x="-6" y="-70" width="12" height="24" fill="${W}"/>`,L,W),'Identity, signage'],
['Sprout Market',brandCard('Sprout',`<path d="M0 50V-10M0 -10q-40 0 -44 -40q40 0 44 40M0 10q36 0 40 -36q-36 0 -40 36" fill="${D}"/>`,M,L),'Packaging']]}
};

const fig=([t,svg,m])=>`<figure><div class="tile" role="img" aria-label="${t}">${svg}</div><figcaption><b>${t}</b><span>${m}</span></figcaption></figure>`;
const NAV=cur=>`<nav aria-label="Portfolio sections">${Object.entries(ART).map(([k,v])=>`<a href="#${k}"${k===cur?' aria-current="page"':''}>${v.title}</a>`).join('')}</nav>`;
const FOOT=`<footer><h3>Say hello</h3><p><a href="mailto:hello@example.com">hello@example.com</a><br><a href="#">Back to home</a></p></footer>`;
function render(){
 const k=location.hash.slice(1),app=document.getElementById('app');
 if(ART[k]){document.title=ART[k].title+' — Yolanda W Fan';
  app.innerHTML=`<header class="hero small"><div class="top"><a href="#">Yolanda W Fan</a>${NAV(k)}</div><h1>${ART[k].title}</h1></header><section><div class="grid">${ART[k].items.map(fig).join('')}</div><div class="more">${Object.keys(ART).filter(x=>x!==k).map(x=>`<a href="#${x}">${ART[x].title}</a>`).join('')}</div></section>${FOOT}`;
 }else{document.title='Yolanda W Fan — Art Portfolio';
  app.innerHTML=`<header class="hero"><div class="top"><span>Yolanda W Fan</span><span>Portfolio, 2026</span></div><div><h1>Steeped in Memory<em>回忆·回甘</em></h1><p class="lede">Drawings, graphic design and branding by Yolanda W Fan, an independent artist and designer.</p><div class="index">${Object.entries(ART).map(([x,v])=>`<a href="#${x}">${v.title}</a>`).join('')}</div></div></header><section><div class="grid">${Object.entries(ART).map(([x,v])=>`<a class="cat" href="#${x}"><div class="tile">${v.items[0][1]}</div><h3>${v.title}</h3><p>${v.items.length} pieces</p></a>`).join('')}</div></section>${FOOT}`;}
 window.scrollTo(0,0);
}
addEventListener('hashchange',render);render();
 <!-- ABOUT SECTION: paste just before </body> -->
<style>
  #about{
    --ink:#2a382a; --soft:#5d6b5d; --mist:#e8ebea; --card:#f1f5ee;
    padding:clamp(64px,10vw,140px) clamp(24px,5vw,56px);
    background:#fcfdfb; color:var(--ink);
    font-family:'Karla',system-ui,sans-serif; font-weight:300; line-height:1.6;
  }
  #about *{box-sizing:border-box}
  #about h2{
    font-family:'Instrument Serif',Georgia,serif; font-weight:400;
    font-size:clamp(2.6rem,7vw,6rem); line-height:1; margin:0 0 2.5rem;
    letter-spacing:-.02em;
  }
  #about .about-grid{
    display:grid; gap:clamp(32px,6vw,96px);
    grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));
  }
  #about .statement{
    font-family:'Instrument Serif',Georgia,serif;
    font-size:clamp(1.8rem,4vw,3.2rem); line-height:1.15; margin:0;
  }
  #about .art{
    aspect-ratio:1; max-width:240px; margin-top:2.5rem; background:var(--card);
  }
  #about .art svg{width:100%;height:100%;display:block}
  #about p{margin:0 0 1.2rem; max-width:56ch; font-size:1.05rem}
  #about dl{
    margin:2rem 0 0; padding-top:1.4rem; border-top:1px solid var(--mist);
    display:grid; grid-template-columns:auto 1fr; gap:.6rem 2rem;
  }
  #about dt{color:var(--soft)}
  #about dd{margin:0}
  #about a{color:inherit}
</style>

<section id="about">
  <h2>About</h2>
  <div class="about-grid">
    <div>
      <p class="statement">I make quiet, considered work that leaves room to breathe.</p>
      <div class="art" aria-hidden="true">
        <svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
          <path d="M200 380C200 260 210 160 240 50" fill="none" stroke="#2a382a" stroke-width="2" stroke-linecap="round"/>
          <path d="M202 330q-30-16-60-4M204 290q-28-16-56-4M207 250q-26-16-52-4M211 210q-24-16-48-4M216 170q-22-16-44-4
                   M204 324q30-16 60-4M207 284q28-16 56-4M211 244q26-16 52-4M216 204q24-16 48-4M222 164q22-16 44-4"
                fill="none" stroke="#6f9f63" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </div>
    </div>
    <div>
      <p>Yolanda's artistic practice explores Chinese social and cultural heritage, drawing connections between her past and present experiences. Through her work, she reflects on her personal history, cultural identity, and the emotional significance of her ethnic background.</p>
      <p>Her projects invite viewers to immerse themselves in the richness of Chinese culture while gaining insight into her personal story and the experiences that continue to shape her artistic perspective.</p>
      <dl>
        <dt>Drawings</dt><dd>Ink, pencil and charcoal</dd>
        <dt>Graphic design</dt><dd>Posters, covers, editorial</dd>
        <dt>Branding</dt><dd>Logos and visual identities</dd>
        <dt>Based in</dt><dd>Winston-Salem</dd>
        <dt>Email</dt><dd><a href="mailto:yolandawfan@gmail.com">yolandawfan@gmail.com</a></dd>
      </dl>
    </div>
  </div>
</section>
</script></body></html>
